# PostgreSQL for local development. Start with: docker compose up -d
# Set POSTGRES_PASSWORD in your shell or a .env file at the project root. Do not commit it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kabadiwala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: kabadiwala
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
